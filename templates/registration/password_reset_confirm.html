{% extends "base.html" %}
{% load static %}
{% block head_title %}
    Password Reset
{% endblock head_title %}

{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="col-md-10">
        <div class="row justify-content-center align-items center">
            <div class="col-md-4">
                <img src="{% static 'img/kontak girl.png' %}" class="mx-auto d-block img-fluid w-100" 
                srcset="">
            </div>
            <div class="col-md-4 mt-5 pt-5">
                {% if validlink %}
                <h4 class="text-text-black-50">Masukkan kata sandi baru</h4>
                <small class="text-text-black-50">silahkan masukkan sandi baru anda</small>
                <form action="" method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="new_password1" class="form-label">New Password</label>
                        <input type="password" name="new_password1" id="new_password1" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label for="new_password2" class="form-label">Confirm Password</label>
                        <input type="password" name="new_password2" id="new_password2" class="form-control">
                    </div>
                    <button class="btn btn-primary shadow-sm text-white">Reset Password</button>
                </form>
                {% else %}
                <p class="text-danger">Link tidak valid</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
