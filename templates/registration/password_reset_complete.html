{% extends "base.html" %}
{% block head_title %}
    Password Reset
{% endblock head_title %}

{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="col-md-7">
        <div class="row justify-content-center ">
            <i class="bi bi-info-circle-fill text-center text-info " style="font-size:10rem;"></i>
            <h2 class="mb-3 fs-2 text-center">Sandi anda berhasil diubah !</h2>
            <div class="alert alert-info shadow">
                <p class="fs-5">Reset Password berhasil</p>
                <p class="fs-5">Silahkan login dengan password anda yang baru. 
                    <a href="{% url 'accounts:login' %}" class="text-primary">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
