{% extends "base.html" %}
{% load static %}
{% block head_title %} {{title}} {% endblock head_title %} 

{% block content %}
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="col-md-5">
        <h2>Daftar</h2>
        {% comment %} <div class="alert alert-success" role="alert">
            <i class="bi bi-info-circle"></i> Daftar berhasil
        </div> {% endcomment %}
        {% if form.errors %}
        <div class="alert alert-danger" role="alert">
            <i class="bi bi-info-circle"></i> Daftar gagal, username sudah terdaftar!
        </div>
        {% endif %}
        <form class="mt-3" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.nama.auto_id }}" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="{{ form.nama.auto_id }}" name="nama" aria-describedby="emailHelp"
                    placeholder="Masukan nama lengkap">
                <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
            </div>
            <div class="mb-3">
                <label for="{{ form.no_hp.auto_id }}" class="form-label">No. Handphone</label>
                <input type="text" class="form-control" id="{{ form.no_hp.auto_id }}" name="no_hp" aria-describedby="emailHelp"
                    placeholder="Masukan No. Hp anda">
                <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
            </div>
            <div class="mb-3">
                <label for="{{ form.email.auto_id }}" class="form-label">Email</label>
                <input type="email" class="form-control" id="{{ form.email.auto_id }}" name="email" aria-describedby="emailHelp"
                    placeholder="Masukan email">
                <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
            </div>
            <div class="mb-3">
                <label for="{{ form.password1.auto_id }}" class="form-label">Kata Sandi</label>
                <input type="password" class="form-control" id="{{ form.password1.auto_id }}" name="password1"
                    placeholder="Masukan kata sandi">
            </div>
            <div class="mb-3">
                <label for="{{ form.password2.auto_id }}" class="form-label">Ulang Kata Sandi</label>
                <input type="password" class="form-control" id="{{ form.password2.auto_id }}" name="password2"
                    placeholder="Konfirmasi kata sandi">
            </div>
            <button type="submit" class="btn btn-primary shadow-sm text-white">Daftar</button>
        </form>
    </div>
</div>
{% endblock content %}
